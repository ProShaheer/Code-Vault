<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeVault</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="	bg-gray-100 p-8">
    <div class="mx-auto mt-4 max-w-md rounded-xl bg-white p-5 shadow">
        <h1 class="text-3xl font-bold text-blue-500">CodeVault</h1>
        <input id="title" class="w-full rounded border p-2" type="text" placeholder="Title Box">
        <textarea id="code" class="mt-3 w-full rounded border p-2" placeholder="Code"></textarea>
        <button id="addbtn" class="mt-3 rounded bg-blue-500 px-4 py-2 text-white">Add Note</button>

    </div>

    <div id="notes"></div>



    <script>
        const addbtn = document.getElementById("addbtn")
        const titleBox = document.getElementById("title")
        const codeBox = document.getElementById("code")
        const notesBox = document.getElementById("notes")
        const notes = JSON.parse(localStorage.getItem("CodeVaultNotes")) || []
        function showNotes() {
            notesBox.innerHTML = ""

            notes.forEach((note, index) => {
                notesBox.innerHTML += `
            <div class="mx-auto mt-4 max-w-md rounded-xl bg-white p-5 shadow">
                <h2 class="font-bold">${note.title}</h2>
                <p class="mt-2 rounded bg-gray-900 p-2 text-green-300">${note.code}</p>
                <button onclick="deleteNote(${index})" class="mt-3 rounded bg-red-500 px-3 py-1 text-white">Delete</button>
            </div>
        `
            })
        }

        addbtn.addEventListener("click", () => {
            if (titleBox.value === "" || codeBox.value === "") {
                return
            }
            notes.push({ title: titleBox.value, code: codeBox.value })
            showNotes()
            saveNotes()
            titleBox.value = ""
            codeBox.value = ""
        })

        function deleteNote(index) {
            notes.splice(index, 1)
            saveNotes()
            showNotes()
        }

        showNotes()
        function saveNotes() {
            localStorage.setItem("CodeVaultNotes", JSON.stringify(notes))
        }
    </script>
</body>

</html>
